<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Tend</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f2f3f5;
      --surface: rgba(255,255,255,.92);
      --surface-solid: #fff;
      --surface-soft: #f7f8fa;
      --text: #181a1d;
      --muted: #70757d;
      --line: rgba(24,26,29,.12);
      --accent: #356df3;
      --accent-soft: #e9efff;
      --success: #24875e;
      --danger: #bd3f39;
      --danger-soft: #fff0ef;
      --shadow: 0 18px 48px rgba(29,34,45,.13);
      --nav-width: 278px;
      --tray-width: 370px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111316;
        --surface: rgba(27,29,33,.94);
        --surface-solid: #1b1d21;
        --surface-soft: #22252a;
        --text: #f4f5f7;
        --muted: #a4a9b1;
        --line: rgba(255,255,255,.12);
        --accent: #7da3ff;
        --accent-soft: #263453;
        --success: #65ca9e;
        --danger: #ff7c74;
        --danger-soft: #3f2828;
        --shadow: 0 18px 48px rgba(0,0,0,.35);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled, input:disabled, select:disabled, textarea:disabled { cursor: not-allowed; opacity: .5; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin: 0; font-size: 21px; letter-spacing: -.02em; }
    h2 { margin: 0; font-size: 24px; letter-spacing: -.025em; }
    h3, .eyebrow { margin: 0; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .app { height: 100%; display: grid; grid-template-rows: 64px minmax(0,1fr); }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--surface-solid);
    }
    .brand, .top-actions, .row, .inline, .status-line { display: flex; align-items: center; }
    .brand { gap: 11px; min-width: 0; }
    .brand-mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff; background: var(--accent); font-weight: 900; }
    .identity { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-actions { gap: 8px; }
    .dot { width: 9px; height: 9px; flex: 0 0 auto; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 14%, transparent); }
    .dot.online { background: var(--success); box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 14%, transparent); }
    .icon-button, .button {
      border: 1px solid var(--line); border-radius: 9px; background: var(--surface-solid); font-weight: 700;
    }
    .icon-button { width: 36px; height: 36px; display: grid; place-items: center; padding: 0; }
    .button { min-height: 36px; padding: 7px 12px; }
    .button:hover:not(:disabled), .icon-button:hover:not(:disabled) { border-color: var(--accent); }
    .button.primary { color: #fff; background: var(--accent); border-color: transparent; }
    .button.quiet { background: transparent; border-color: transparent; color: var(--muted); }
    .button.tertiary { min-height: 30px; padding: 4px 8px; background: transparent; color: var(--muted); border-style: dashed; }
    .button.danger { color: var(--danger); background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 36%, transparent); }
    .workspace { position: relative; min-height: 0; display: grid; grid-template-columns: var(--nav-width) minmax(0,1fr); overflow: hidden; }
    .nav, .tray, .center { min-height: 0; background: var(--surface); }
    .nav { border-right: 1px solid var(--line); padding: 18px 14px; overflow-y: auto; }
    .center { min-width: 0; padding: 22px; overflow-y: auto; container-type: inline-size; }
    .tray {
      position: absolute; inset-block: 0; width: min(var(--tray-width), 90vw); z-index: 20;
      display: none; overflow-y: auto; padding: 18px; background: var(--surface-solid); box-shadow: var(--shadow);
    }
    .tray.open { display: block; }
    .detail-tray { right: 0; border-left: 1px solid var(--line); }
    .settings-tray { right: 0; border-left: 1px solid var(--line); }
    .workspace.detail-open .center { margin-right: var(--tray-width); }
    .workspace.settings-open .center { margin-right: var(--tray-width); }
    .workspace.detail-open .detail-tray, .workspace.settings-open .settings-tray { box-shadow: none; }
    .tray-head, .view-head, .section-head, .composer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .tray-head { position: sticky; top: -18px; z-index: 2; margin: -18px -18px 16px; padding: 16px 18px; border-bottom: 1px solid var(--line); background: var(--surface-solid); }
    .nav-section { margin-bottom: 22px; }
    .nav-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .nav-list { display: grid; gap: 4px; }
    .nav-button { width: 100%; min-width: 0; display: flex; align-items: center; gap: 9px; border: 0; border-radius: 9px; padding: 9px 10px; background: transparent; text-align: left; }
    .list-avatar { width: 26px; height: 26px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 900; }
    .nav-copy { min-width: 0; flex: 1; display: grid; gap: 1px; }
    .nav-button:hover, .nav-button.active { background: var(--accent-soft); }
    .nav-label { min-width: 0; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .muted { color: var(--muted); }
    .tiny { font-size: 11px; }
    .field, .select, .textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-soft); outline: none;
    }
    .field, .select { min-height: 38px; padding: 8px 10px; }
    .textarea { min-height: 108px; padding: 10px; resize: vertical; }
    .field:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 13%, transparent); }
    .stack { display: grid; gap: 10px; }
    .divider { height: 1px; background: var(--line); margin: 16px 0; }
    .view-head { margin-bottom: 18px; }
    .view-title { min-width: 0; }
    .status-line { gap: 8px; margin-top: 6px; color: var(--muted); font-size: 12px; }
    .filters { display: grid; grid-template-columns: minmax(170px,1fr) 180px 150px auto; gap: 8px; margin-bottom: 18px; }
    .sort-direction { min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; }
    .composer { padding: 15px; margin-bottom: 18px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-soft); }
    .composer-head { margin-bottom: 10px; }
    .composer-row { display: grid; grid-template-columns: minmax(0,1fr) minmax(135px,190px) minmax(155px,205px) 40px; gap: 8px; }
    .composer-row > * { min-width: 0; max-width: 100%; }
    .section-adder { display: flex; align-items: center; gap: 7px; margin: 0 0 14px; }
    .section-adder .field { width: 210px; min-height: 32px; }
    .task-list { display: grid; gap: 5px; }
    .task {
      display: grid; grid-template-columns: 27px minmax(0,1fr) auto; gap: 10px; align-items: center;
      min-height: 54px; padding: 9px 10px; border: 1px solid transparent; border-radius: 10px; background: var(--surface-soft);
      transition: opacity 5s ease, transform .18s ease, border-color .15s ease;
    }
    .task:hover, .task.selected { border-color: var(--line); background: var(--surface-solid); }
    .task.completing { opacity: .28; }
    .task-title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 700; }
    .task.done .task-title { color: var(--muted); text-decoration: line-through; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 5px 12px; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .task-actions { display: flex; gap: 2px; }
    .flag { color: var(--muted); }
    .flag.active { color: var(--danger); }
    .flag-control { display: inline-flex; align-items: center; gap: 8px; }
    .flag-control .flag { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-soft); font-size: 18px; }
    .flag-control .flag:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
    .selection-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-bottom: 14px; padding: 10px; border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 11px; background: var(--accent-soft); }
    .mini { width: 28px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); }
    .mini:hover { color: var(--text); background: var(--accent-soft); }
    .check { width: 18px; height: 18px; accent-color: var(--accent); }
    .empty { padding: 70px 18px; text-align: center; color: var(--muted); }
    .form-section { display: grid; gap: 10px; margin-bottom: 19px; }
    .label { display: grid; gap: 5px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .check-row { display: flex; align-items: center; gap: 8px; min-height: 34px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .tag-box { display: flex; flex-wrap: wrap; gap: 6px; padding: 7px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-soft); }
    .tag-box input { min-width: 110px; flex: 1; border: 0; outline: 0; background: transparent; }
    .chip { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 4px 7px; border-radius: 999px; background: var(--accent-soft); font-size: 12px; }
    .chip button { border: 0; padding: 0; background: transparent; color: inherit; }
    .people { display: grid; gap: 6px; }
    .person { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 9px; border: 1px solid var(--line); border-radius: 9px; }
    .appearance-preview { display: flex; align-items: center; gap: 11px; padding: 11px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-soft); }
    .appearance-preview .list-avatar { width: 38px; height: 38px; font-size: 16px; }
    .invitation-card { padding: 12px; border: 1px solid color-mix(in srgb, var(--accent) 48%, var(--line)); border-radius: 11px; background: var(--accent-soft); }
    .section-settings { display: grid; gap: 7px; }
    .section-setting { display: grid; grid-template-columns: minmax(0,1fr) auto auto auto; gap: 6px; align-items: center; }
    input[type="datetime-local"] { min-width: 0; max-width: 100%; }
    .invites { position: fixed; right: 18px; bottom: 18px; z-index: 50; display: grid; gap: 8px; width: min(390px, calc(100vw - 36px)); }
    .invite { padding: 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-solid); box-shadow: var(--shadow); }
    .notice { position: fixed; left: 50%; bottom: 18px; z-index: 60; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; padding: 9px 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-solid); box-shadow: var(--shadow); transition: .18s ease; }
    .notice.show { opacity: 1; transform: translate(-50%, 0); }
    .notice.error { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
    .notice.success { color: var(--success); }
    .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 1200px) {
      .workspace.detail-open .center, .workspace.settings-open .center { margin-left: 0; margin-right: 0; }
      .detail-tray, .settings-tray { box-shadow: var(--shadow); }
      .filters { grid-template-columns: minmax(150px,1fr) 160px 140px auto; }
    }
    @container (max-width: 760px) {
      .composer-row { grid-template-columns: minmax(0,1fr) minmax(150px, .65fr); }
      .composer-row .button.primary { width: 100%; }
      .filters { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 860px) {
      :root { --nav-width: 220px; }
      .center { padding: 16px; }
      .composer-row { grid-template-columns: minmax(140px,1fr) 150px 175px 40px; }
      .filters { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 650px) {
      :root { --nav-width: 0px; }
      .workspace { grid-template-columns: 1fr; }
      .nav { display: none; }
      .tray { width: min(430px, 94vw); }
      .composer-row { grid-template-columns: 1fr; }
      .composer-row .button { width: 100%; }
      .task-actions { display: none; }
      .topbar { padding-inline: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✓</div>
        <div><h1>Tend</h1><div class="identity" id="identity">Connecting to your ship…</div></div>
      </div>
      <div class="top-actions">
        <span class="dot" id="connection" role="status" aria-label="Connection unavailable" title="Connection unavailable"></span>
        <button class="icon-button" id="refresh" type="button" aria-label="Refresh" title="Refresh">↻</button>
        <button class="icon-button" id="open-settings" type="button" aria-label="Open settings" title="Settings">⚙</button>
      </div>
    </header>

    <div class="workspace" id="workspace">
      <aside class="nav" id="navigation" aria-label="Tend navigation"></aside>
      <aside class="tray detail-tray" id="detail-tray" aria-label="Reminder details"></aside>
      <main class="center" id="main"><div class="empty">Loading Tend…</div></main>
      <aside class="tray settings-tray" id="settings-tray" aria-label="Settings"></aside>
    </div>
  </div>
  <div class="invites" id="invitations"></div>
  <div class="notice" id="notice" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const state = {
        ship: "", lists: [], accesses: [], invitations: [], preferences: {},
        selectedListId: null, selectedReminderId: null, view: "all", search: "", tag: "", sort: "manual", descending: false,
        rightTray: "", busy: false, online: false, detailDraft: null, completionGrace: new Map(), saveTimer: null,
        selectionMode: false, selectedReminderIds: new Set(), hiddenInvitationKeys: new Set()
      };
      const views = [
        ["today", "Today"], ["all", "All"], ["flagged", "Flagged"], ["assigned", "Assigned"], ["completed", "Completed"]
      ];
      const $ = id => document.getElementById(id);
      const escapeHtml = value => String(value ?? "").replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[char]);
      const opId = () => Date.now().toString(36) + "-" + Math.floor(Math.random() * 2147483647).toString(36);
      const normalizeShip = value => { const raw = String(value || "").trim(); return raw && !raw.startsWith("~") ? "~" + raw : raw; };
      const sameShip = (a, b) => normalizeShip(a).replace(/^~/, "") === normalizeShip(b).replace(/^~/, "");
      const selectedList = () => state.lists.find(item => Number(item.id) === Number(state.selectedListId)) || null;
      const accessFor = listId => state.accesses.find(item => Number(item.alias) === Number(listId)) || null;
      const invitationKey = invitation => [invitation && invitation.host, invitation && invitation.token, invitation && invitation.title].join(":");
      const selectedReminder = () => {
        const list = selectedList();
        return list ? (list.reminders || []).find(item => Number(item.id) === Number(state.selectedReminderId)) || null : null;
      };
      function reminderDepth(list, reminder) {
        if (!list || !reminder) return 0;
        const reminders = list.reminders || [];
        const seen = new Set([Number(reminder.id)]);
        let parentId = reminder["parent-id"] ?? reminder.parentId ?? null;
        let depth = 0;
        while (parentId !== null && parentId !== undefined && depth < 24) {
          const numeric = Number(parentId);
          if (seen.has(numeric)) break;
          seen.add(numeric);
          const parent = reminders.find(item => Number(item.id) === numeric);
          if (!parent) break;
          depth += 1;
          parentId = parent["parent-id"] ?? parent.parentId ?? null;
        }
        return depth;
      }
      function canEdit(listId) {
        const access = accessFor(listId);
        return state.online && !!access && (access.owner === true || access.status === "online");
      }
      function showNotice(message, kind = "success") {
        const node = $("notice");
        node.textContent = message || "";
        node.className = "notice" + (message ? " show" : "") + (kind ? " " + kind : "");
        clearTimeout(showNotice.timer);
        showNotice.timer = setTimeout(() => node.className = "notice", kind === "error" ? 5000 : 2200);
      }
      function formatDue(schedule) {
        const raw = schedule && (schedule["due-at"] || schedule.dueAt);
        if (!raw) return "";
        const urbit = String(raw).match(/^~(\d+)\.(\d+)\.(\d+)\.\.(\d+)\.(\d+)\.(\d+)/);
        if (urbit) {
          const date = new Date(Date.UTC(+urbit[1], +urbit[2] - 1, +urbit[3], +urbit[4], +urbit[5], +urbit[6]));
          return schedule["all-day"] ? date.toLocaleDateString() : date.toLocaleString([], {dateStyle:"medium", timeStyle:"short"});
        }
        const parsed = new Date(raw);
        return Number.isNaN(parsed.getTime()) ? String(raw) : (schedule["all-day"] ? parsed.toLocaleDateString() : parsed.toLocaleString([], {dateStyle:"medium", timeStyle:"short"}));
      }
      function inputDue(schedule) {
        const raw = schedule && (schedule["due-at"] || schedule.dueAt);
        if (!raw) return "";
        const urbit = String(raw).match(/^~(\d+)\.(\d+)\.(\d+)\.\.(\d+)\.(\d+)/);
        if (urbit) return `${urbit[1]}-${String(urbit[2]).padStart(2,"0")}-${String(urbit[3]).padStart(2,"0")}T${String(urbit[4]).padStart(2,"0")}:${String(urbit[5]).padStart(2,"0")}`;
        const date = new Date(raw);
        if (Number.isNaN(date.getTime())) return String(raw).slice(0,16);
        const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
        return local.toISOString().slice(0,16);
      }
      function allTags() {
        return [...new Set(state.lists.flatMap(list => (list.reminders || []).flatMap(reminder => reminder.tags || [])))].sort();
      }
      function assigneeOptions(list) {
        const access = list && accessFor(list.id);
        const seen = new Set();
        const result = [{value:"", label:"Unassigned", role:""}];
        const add = (ship, role) => {
          const normalized = normalizeShip(ship); const key = normalized.replace(/^~/, "");
          if (!key || seen.has(key)) return;
          seen.add(key);
          result.push({value:normalized, label:sameShip(normalized, state.ship) ? "me" : normalized, role});
        };
        if (access) {
          add(access.host, "admin");
          (access.members || []).forEach(member => add(member.ship, member.policy && (member.policy["can-invite"] || member.policy.canInvite) ? "admin" : "editor"));
          (access.pending || []).forEach(ship => add(ship, "invited"));
        }
        add(state.ship, access && access.owner ? "admin" : "editor");
        return result;
      }
      const optionHtml = (options, selected) => options.map(option => `<option value="${escapeHtml(option.value)}" ${String(option.value) === String(selected || "") ? "selected" : ""}>${escapeHtml(option.label)}${option.role ? ` (${escapeHtml(option.role)})` : ""}</option>`).join("");

      async function json(url) {
        const response = await fetch(url, {credentials:"same-origin", headers:{Accept:"application/json"}});
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        return response.json();
      }
      async function load({quiet = false} = {}) {
        if (state.busy) return;
        if (!quiet) setConnection(false, "Checking connection");
        try {
          const [ship, snapshotEnvelope, accessEnvelope, invitationEnvelope] = await Promise.all([
            json("/~/scry/tend/whoami.json"), json("/~/scry/tend/state.json"), json("/~/scry/tend/accesses.json"), json("/~/scry/tend/invitations.json")
          ]);
          const snapshot = snapshotEnvelope.snapshot || {};
          if (snapshot["protocol-version"] !== 1) throw new Error("This Tend client requires protocol version 1.");
          state.ship = normalizeShip(ship);
          state.lists = Array.isArray(snapshot.lists) ? snapshot.lists : [];
          state.preferences = snapshot.preferences || {};
          state.accesses = Array.isArray(accessEnvelope.accesses) ? accessEnvelope.accesses : [];
          state.invitations = Array.isArray(invitationEnvelope["invitations-updated"]) ? invitationEnvelope["invitations-updated"] : [];
          if (!state.lists.some(item => Number(item.id) === Number(state.selectedListId))) state.selectedListId = state.lists.length ? Number(state.lists[0].id) : null;
          if (state.selectedReminderId && !selectedReminder()) closeDetail();
          state.online = true;
          $("identity").textContent = state.ship || "Signed in";
          setConnection(true, "Connected to " + (state.ship || "ship"));
          render();
        } catch (error) {
          state.online = false;
          setConnection(false, "Connection unavailable");
          showNotice(`Tend could not load: ${error.message}`, "error");
          render();
        }
      }
      function setConnection(online, label) {
        const node = $("connection");
        node.className = "dot" + (online ? " online" : "");
        node.setAttribute("aria-label", label);
        node.title = label;
      }
      async function sendChannelCommand(url, commands) {
        const response = await fetch(url, {method:"PUT", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body:JSON.stringify(commands)});
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      }
      async function poke(action, {quiet = false} = {}) {
        if (state.busy) return false;
        state.busy = true;
        const channelId = `tend-web-${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
        const url = `/~/channel/${channelId}`;
        let source, timeout;
        try {
          await sendChannelCommand(url, [{id:1, action:"poke", ship:state.ship.replace(/^~/,""), app:"tend", mark:"tend-action-1", json:action}]);
          await new Promise((resolve, reject) => {
            timeout = setTimeout(() => reject(new Error("Tend did not acknowledge the action.")), 15000);
            source = new EventSource(url);
            source.onerror = () => reject(new Error("The Tend event channel closed unexpectedly."));
            source.onmessage = event => {
              let message; try { message = JSON.parse(event.data); } catch (_) { return; }
              if (event.lastEventId) sendChannelCommand(url, [{action:"ack", "event-id":Number(event.lastEventId)}]).catch(() => {});
              if (message.id !== 1 || message.response !== "poke") return;

        const updated = await poke({"update-reminder":{"operation-id":opId(),"list-id":Number(currentList.id),"reminder-id":Number(currentReminder.id),title:draft.title.trim(),notes:draft.notes,url:draft.url || null,priority:draft.priority,flagged:draft.flagged,tags:draft.tags,assignee:draft.assignee || null,"base-revision":Number(currentList.revision)}},{quiet:true});
        if (!updated) return;
        const refreshedList = selectedList(); const refreshedReminder = selectedReminder();
        if (!refreshedList || !refreshedReminder) return;
        const oldDue = inputDue(refreshedReminder.schedule); const oldAllDay = !!(refreshedReminder.schedule && refreshedReminder.schedule["all-day"]);
        if (draft.due !== oldDue || draft.allDay !== oldAllDay) {
          await poke({"set-schedule":{"operation-id":opId(),"list-id":Number(refreshedList.id),"reminder-id":Number(refreshedReminder.id),schedule:draft.due ? {"due-at":draft.due,"all-day":draft.allDay,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,"_all-day-alert-minute":Number(state.preferences["all-day-alert-minute"] || 0),"early-seconds":[],recurrence:null} : null,"base-revision":Number(refreshedList.revision)}},{quiet:true});
        }
        showNotice("Details saved");
      }
      async function setReminderFlagged(listId, reminderId, flagged) {
        const list = state.lists.find(item => Number(item.id) === Number(listId));
        const reminder = list && (list.reminders || []).find(item => Number(item.id) === Number(reminderId));
        if (!list || !reminder || !canEdit(list.id)) return;
        if (state.detailDraft && Number(state.detailDraft.id) === Number(reminderId)) state.detailDraft.flagged = flagged;
        await poke({"update-reminder":{"operation-id":opId(),"list-id":Number(list.id),"reminder-id":Number(reminder.id),title:reminder.title,notes:reminder.notes || "",url:reminder.url || null,priority:reminder.priority || "none",flagged:flagged,tags:reminder.tags || [],assignee:reminder.assignee || null,"base-revision":Number(list.revision)}},{quiet:true});
      }
      async function moveReminder(reminderId, direction) {
        const list = selectedList(); if (!list) return;
        const reminder = (list.reminders || []).find(item => Number(item.id) === Number(reminderId)); if (!reminder) return;
        const parent = reminder["parent-id"] ?? reminder.parentId ?? null; const section = reminder["section-id"] ?? reminder.sectionId ?? null;
        const siblings = (list.reminders || []).filter(item => (item["parent-id"] ?? item.parentId ?? null) === parent && (item["section-id"] ?? item.sectionId ?? null) === section).sort((a,b) => Number(a.rank || 0) - Number(b.rank || 0) || Number(a.id)-Number(b.id));
        const index = siblings.findIndex(item => Number(item.id) === Number(reminder.id)); const target = index + (direction === "up" ? -1 : 1);
        if (index < 0 || target < 0 || target >= siblings.length) return;
        await poke({"place-reminder":{"operation-id":opId(),"list-id":Number(list.id),"reminder-id":Number(reminder.id),"target-id":Number(siblings[target].id),after:direction !== "up","base-revision":Number(list.revision)}});
      }
      async function indentReminder(reminderId, outdent = false) {
        const list = selectedList();
        const reminder = list && (list.reminders || []).find(item => Number(item.id) === Number(reminderId));
        if (!list || !reminder) return;
        const parentId = reminder["parent-id"] ?? reminder.parentId ?? null;
        let targetParent = null;
        if (outdent) {
          if (parentId === null) return;
          const parent = (list.reminders || []).find(item => Number(item.id) === Number(parentId));
          targetParent = parent ? (parent["parent-id"] ?? parent.parentId ?? null) : null;
        } else {
          const siblings = (list.reminders || []).filter(item => (item["parent-id"] ?? item.parentId ?? null) === parentId).sort((a,b) => Number(a.rank||0)-Number(b.rank||0));
          const index = siblings.findIndex(item => Number(item.id) === Number(reminder.id));
          if (index <= 0) return;
          targetParent = siblings[index-1].id;
        }
        await poke({"move-reminder":{"operation-id":opId(),"list-id":Number(list.id),"reminder-id":Number(reminder.id),"parent-id":targetParent,"section-id":reminder["section-id"] ?? reminder.sectionId ?? null,rank:Number(reminder.rank || 1024),"base-revision":Number(list.revision)}});
      }
      async function moveSelectedToSection(sectionId) {
        const ids = [...state.selectedReminderIds];
        for (const id of ids) {
          const list = selectedList();
          const reminder = list && (list.reminders || []).find(item => Number(item.id) === Number(id));
          if (!list || !reminder) continue;
          await poke({"move-reminder":{"operation-id":opId(),"list-id":Number(list.id),"reminder-id":Number(reminder.id),"parent-id":null,"section-id":sectionId ? Number(sectionId) : null,rank:Number(reminder.rank || 1024),"base-revision":Number(list.revision)}},{quiet:true});
        }
      }
      async function setSelectedCompleted(completed) {
        const ids = [...state.selectedReminderIds];
        for (const id of ids) {
          const list = selectedList();
          const reminder = list && (list.reminders || []).find(item => Number(item.id) === Number(id));
          if (!list || !reminder || reminder.completed === completed) continue;
          await poke({"set-completed":{"operation-id":opId(),"list-id":Number(list.id),"reminder-id":Number(id),completed,"base-revision":Number(list.revision)}},{quiet:true});
        }
      }
      async function deleteSelected() {
        const ids = [...state.selectedReminderIds];
        for (const id of ids) {
          const list = selectedList();
          const reminder = list && (list.reminders || []).find(item => Number(item.id) === Number(id));
          if (!list || !reminder) continue;
          await poke({"delete-reminder":{"operation-id":opId(),"list-id":Number(list.id),"reminder-id":Number(id),"base-revision":Number(list.revision)}},{quiet:true});
        }
        state.selectedReminderIds.clear();
      }

      document.addEventListener("click", async event => {
        const listButton = event.target.closest("[data-list-id]");
        if (listButton) { state.selectedListId = Number(listButton.dataset.listId); state.view = "list"; state.selectedReminderId = null; state.rightTray = ""; state.selectionMode = false; state.selectedReminderIds.clear(); render(); return; }
        const viewButton = event.target.closest("[data-view]");
        if (viewButton) { state.view = viewButton.dataset.view; state.selectedReminderId = null; state.selectionMode = false; state.selectedReminderIds.clear(); render(); return; }
        const task = event.target.closest(".task");
        if (task && !event.target.closest("button,input")) {
          if (state.selectionMode && state.view === "list") {
            const id = Number(task.dataset.reminderId);
            state.selectedReminderIds.has(id) ? state.selectedReminderIds.delete(id) : state.selectedReminderIds.add(id);
            renderMain(); return;
          }
          state.selectedListId = Number(task.dataset.reminderList); openDetail(task.dataset.reminderId); return;
        }
        if (event.target.closest("[data-open-detail]") && task) { state.selectedListId = Number(task.dataset.reminderList); openDetail(task.dataset.reminderId); return; }
        if (event.target.closest("#sort-direction")) { state.descending = !state.descending; renderMain(); return; }
        if (event.target.closest("[data-toggle-selection]")) { state.selectionMode = !state.selectionMode; state.selectedReminderIds.clear(); closeDetail(); return; }
        if (event.target.closest("[data-close-detail]")) { closeDetail(); return; }
        if (event.target.closest("[data-close-settings]")) { state.rightTray = ""; render(); return; }
        if (event.target.closest("#open-settings")) { openSettings("app"); return; }
        if (event.target.closest("[data-open-list-settings]")) { openSettings("list"); return; }
        const toggleFlag = event.target.closest("[data-toggle-flag]");
        if (toggleFlag) {
          const listId = Number(toggleFlag.dataset.flagList); const reminderId = Number(toggleFlag.dataset.toggleFlag);
          const list = state.lists.find(item => Number(item.id) === listId); const reminder = list && (list.reminders || []).find(item => Number(item.id) === reminderId);
          if (reminder) await setReminderFlagged(listId, reminderId, !reminder.flagged);
          return;
        }
        if (event.target.closest("[data-detail-flag]")) { const reminder = selectedReminder(); if (reminder) await setReminderFlagged(selectedList().id, reminder.id, !reminder.flagged); return; }
        const selectionAction = event.target.closest("[data-selection-action]");
        if (selectionAction) {
          const action = selectionAction.dataset.selectionAction; const ids = [...state.selectedReminderIds];
          if (action === "section") await moveSelectedToSection($("selection-section").value);
          else if (action === "up" && ids.length === 1) await moveReminder(ids[0], "up");
          else if (action === "down" && ids.length === 1) await moveReminder(ids[0], "down");
          else if (action === "indent" && ids.length === 1) await indentReminder(ids[0], false);
          else if (action === "outdent" && ids.length === 1) await indentReminder(ids[0], true);
          else if (action === "complete") await setSelectedCompleted(true);
          else if (action === "open") await setSelectedCompleted(false);
          else if (action === "delete" && confirm(`Delete ${ids.length} selected reminder${ids.length === 1 ? "" : "s"}?`)) await deleteSelected();
          renderMain(); return;
        }
        const sectionAction = event.target.closest("[data-section-action]");
        if (sectionAction) {
          const list = selectedList(); const sections = list && (list.sections || []).slice().sort((a,b) => Number(a.rank || 0) - Number(b.rank || 0)); const id = Number(sectionAction.dataset.sectionId); const index = sections ? sections.findIndex(section => Number(section.id) === id) : -1; const action = sectionAction.dataset.sectionAction;
          if (!list || index < 0) return;
          if (action === "delete" && confirm(`Delete section ${sections[index].title}?`)) await poke({"delete-section":{"operation-id":opId(),"list-id":Number(list.id),"section-id":id,"base-revision":Number(list.revision)}});
          else if (action === "up" && index > 0) await poke({"place-section":{"operation-id":opId(),"list-id":Number(list.id),"section-id":id,"target-id":Number(sections[index - 1].id),after:false,"base-revision":Number(list.revision)}});
          else if (action === "down" && index < sections.length - 1) await poke({"place-section":{"operation-id":opId(),"list-id":Number(list.id),"section-id":id,"target-id":Number(sections[index + 1].id),after:true,"base-revision":Number(list.revision)}});
          return;
        }
        const removeTag = event.target.closest("[data-remove-tag]"); if (removeTag && state.detailDraft) { state.detailDraft.tags = state.detailDraft.tags.filter(tag => tag !== removeTag.dataset.removeTag); renderDetail(); await saveDetail(); return; }
        const accept = event.target.closest("[data-accept-invite]"); if (accept) { const invite = state.invitations[Number(accept.dataset.acceptInvite)]; await poke({"accept-invitation":{"operation-id":opId(),host:invite.host,token:invite.token}}); return; }
        const decline = event.target.closest("[data-decline-invite]"); if (decline) { const invite = state.invitations[Number(decline.dataset.declineInvite)]; await poke({"decline-invitation":{"operation-id":opId(),host:invite.host,token:invite.token}}); return; }
        const hide = event.target.closest("[data-hide-invite]"); if (hide) { const invite = state.invitations[Number(hide.dataset.hideInvite)]; if (invite) state.hiddenInvitationKeys.add(invitationKey(invite)); renderInvitations(); return; }
        if (event.target.closest("[data-make-default]")) { const list = selectedList(); await poke({"set-preferences":{"operation-id":opId(),"default-list":Number(list.id),"pinned-lists":state.preferences["pinned-lists"] || [],"pinned-views":state.preferences["pinned-views"] || [],"snooze-presets":state.preferences["snooze-presets"] || [],"base-revision":Number(state.preferences.revision || 0)}}); return; }
        if (event.target.closest("[data-switch-ship]")) { location.href = "/~/logout"; return; }
        if (event.target.closest("[data-delete-reminder]")) { const list = selectedList(); const reminder = selectedReminder(); if (list && reminder && confirm("Delete this reminder?")) { await poke({"delete-reminder":{"operation-id":opId(),"list-id":Number(list.id),"reminder-id":Number(reminder.id),"base-revision":Number(list.revision)}}); closeDetail(); } return; }
        if (event.target.closest("[data-delete-list]")) { const list = selectedList(); if (list && confirm(`Delete ${list.title}?`)) { await poke({"delete-list":{"operation-id":opId(),"list-id":Number(list.id),"base-revision":Number(list.revision)}}); state.rightTray=""; } return; }
        if (event.target.closest("[data-leave-list]")) { const list = selectedList(); if (list && confirm(`Leave ${list.title}?`)) { await poke({"leave-shared-list":{"operation-id":opId(),"list-id":Number(list.id)}}); state.rightTray=""; } return; }
        if (state.selectedReminderId && !event.target.closest("#detail-tray") && !event.target.closest(".task")) closeDetail();
      });
      document.addEventListener("input", event => {
        if (event.target.id === "search") { state.search = event.target.value; renderMain(); return; }
        if (event.target.matches(".detail-text")) { updateDraftField(event.target); scheduleDetailSave(); }
      });
      document.addEventListener("change", async event => {
        if (event.target.id === "tag-filter") { state.tag = event.target.value; renderMain(); return; }
        if (event.target.id === "sort") { state.sort = event.target.value; renderMain(); return; }
        if (event.target.id === "quick-list") { state.selectedListId = Number(event.target.value); if (state.view === "list") render(); else renderMain(); return; }
        const selected = event.target.closest("[data-select-reminder]");
        if (selected) { const id = Number(selected.dataset.selectReminder); selected.checked ? state.selectedReminderIds.add(id) : state.selectedReminderIds.delete(id); renderMain(); return; }
        const sectionTitle = event.target.closest("[data-section-title]");
        if (sectionTitle) { const list = selectedList(); const section = list && (list.sections || []).find(item => Number(item.id) === Number(sectionTitle.dataset.sectionTitle)); const title = sectionTitle.value.trim(); if (list && section && title && title !== section.title) await poke({"update-section":{"operation-id":opId(),"list-id":Number(list.id),"section-id":Number(section.id),title,rank:Number(section.rank || 1024),"base-revision":Number(list.revision)}}); return; }
        const complete = event.target.closest("[data-complete]");
        if (complete) {
          const listId = Number(complete.dataset.completeList); const list = state.lists.find(item => Number(item.id) === listId); const reminderId = Number(complete.dataset.complete); if (!list) return;
          const key = `${listId}:${reminderId}`;
          if (complete.checked) {
            state.completionGrace.set(key, {started:Date.now()});
            setTimeout(() => { if (state.completionGrace.has(key)) { renderMain(); } }, 5000);
            setTimeout(() => { state.completionGrace.delete(key); renderMain(); }, 10000);
          } else state.completionGrace.delete(key);
          renderMain();
          await poke({"set-completed":{"operation-id":opId(),"list-id":listId,"reminder-id":reminderId,completed:complete.checked,"base-revision":Number(list.revision)}},{quiet:true});
          return;
        }
        if (event.target.matches(".detail-immediate")) { updateDraftField(event.target); await saveDetail(); }
      });
      document.addEventListener("keydown", async event => {
        if (event.target.id === "tag-input" && event.key === "Enter") {
          event.preventDefault(); const value = event.target.value.trim().replace(/^#/,"");
          if (value && state.detailDraft && !state.detailDraft.tags.includes(value)) { state.detailDraft.tags.push(value); renderDetail(); await saveDetail(); }
        }
      });
      document.addEventListener("submit", async event => {
        event.preventDefault(); const form = event.target;
        if (form.id === "new-list-form") { const title = $("new-list-title").value.trim(); if (title) await poke({"create-list":{"operation-id":opId(),title}}); return; }
        if (form.id === "new-reminder-form") {
          const listId = Number($("quick-list").value); const list = state.lists.find(item => Number(item.id) === listId); const title = $("new-reminder-title").value.trim(); if (!list || !title) return;
          const assignee = normalizeShip($("new-reminder-assignee").value); const due = $("new-reminder-due").value;
          const added = await poke({"add-reminder":{"operation-id":opId(),"list-id":listId,title,tags:[],"base-revision":Number(list.revision)}},{quiet:true});
          if (!added) return;
          const refreshed = state.lists.find(item => Number(item.id) === listId); const newest = refreshed && (refreshed.reminders || []).slice().sort((a,b) => Number(b.id)-Number(a.id))[0];
          if (newest) {
            await poke({"update-reminder":{"operation-id":opId(),"list-id":listId,"reminder-id":Number(newest.id),title,notes:"",url:null,priority:"none",flagged:false,tags:[],assignee:assignee || state.ship,"base-revision":Number(refreshed.revision)}},{quiet:true});
            if (due) { const latest = state.lists.find(item => Number(item.id) === listId); await poke({"set-schedule":{"operation-id":opId(),"list-id":listId,"reminder-id":Number(newest.id),schedule:{"due-at":due,"all-day":false,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,"_all-day-alert-minute":Number(state.preferences["all-day-alert-minute"] || 0),"early-seconds":[],recurrence:null},"base-revision":Number(latest.revision)}},{quiet:true}); }
          }
          showNotice("Reminder added"); return;
        }
        if (form.id === "new-section-form") { const list = selectedList(); const title = $("new-section-title").value.trim(); if (!list || !title) return; const sections = list.sections || []; const rank = sections.length ? Number(sections[sections.length-1].rank || 0) + 1024 : 1024; await poke({"add-section":{"operation-id":opId(),"list-id":Number(list.id),title,rank,"base-revision":Number(list.revision)}}); return; }

        if (form.id === "defaults-form") { await poke({"set-reminder-policy":{"operation-id":opId(),"badge-mode":form.elements.badge.value,"all-day-alert-minute":timeToMinutes(form.elements.alert.value),"all-day-overdue":form.elements.overdue.checked,"base-revision":Number(state.preferences.revision || 0)}}); return; }
      });
      $("refresh").addEventListener("click", () => load());
      window.addEventListener("resize", () => { if (window.innerWidth < 1200 && state.selectedReminderId && state.rightTray) state.rightTray = ""; render(); });
      setInterval(() => { const active = document.activeElement; if (!state.busy && (!active || !["INPUT","TEXTAREA","SELECT"].includes(active.tagName))) load({quiet:true}); }, 4000);
      load();
    })();
  </script>
