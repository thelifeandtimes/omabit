name: Checks

on:
  push:
    branches: [master, edge, develop, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Native authentication test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnupg libarchive-tools
      - name: Go tests and vet
        run: |
          go test ./...
          go vet ./...
      - name: Stateful transport and runtime race checks
        run: go test -race -timeout=60m ./internal/managed ./internal/runtimequalify ./internal/client ./internal/access ./internal/collection ./internal/piercopy ./internal/pierstore ./internal/piermeta ./internal/hostinstall ./internal/hostsetup ./internal/onboarding ./internal/remotesetup ./internal/omabittheme ./backend/cmd/urbit-collector ./backend/cmd/urbit-runner
      - name: Offline application recovery fixture checks
        run: |
          python3 -B -m unittest discover -s scripts/qualification/imports -p 'test_runner_app_*.py'
          python3 -B -m unittest discover -s scripts/qualification/fake-networks -p 'test_state*.py'
      - name: Build Linux binaries
        run: |
          mkdir -p build
          CGO_ENABLED=0 go build -trimpath -o build/ ./cmd/... ./backend/cmd/...
      - name: Desktop model and installer fixtures
        run: |
          node scripts/test-panel-model.js
          node scripts/test-runtime-settings-model.js
          python3 -B scripts/test-panel-install.py
          python3 -B scripts/test-native-plugin.py
          python3 -B scripts/test-ssh-hosts.py
          python3 -B scripts/test-release-policy.py
          python3 -B scripts/test-skill-package.py
          python3 -B scripts/test-channels.py
          python3 -B scripts/test-desktop-bootstrap.py
          python3 -B -m unittest discover -s scripts/qualification/desktop -p 'test_*.py'
          python3 -B scripts/test-desktop-qualification.py
          python3 -B scripts/test-import-recovery.py --static
          python3 -B -m unittest discover -s scripts/qualification/host-packages -p 'test_*.py'
      - name: Release source isolation and reproducibility
        run: python3 -B scripts/test-release-source.py --build

  qml-offscreen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install isolated Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qml-qt6 qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-dialogs qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtqml-models
      - name: Actual QML bindings and recovery interactions
        env:
          QT_QML_EXECUTABLE: /usr/lib/qt6/bin/qml
        run: |
          python3 -B scripts/test-rc11-panel-offscreen.py --require-qt
          python3 -B scripts/test-host-compatibility-offscreen.py --require-qt

# Mapped Quickshell tests and live runtime qualification require their separately
# controlled Omarchy/Docker environments; they are not claimed by this CI job.
