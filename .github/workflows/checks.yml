name: Checks

on:
  push:
    branches: [master, edge, develop, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Native authentication test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnupg libarchive-tools
      - name: Go tests and vet
        run: |
          TZ=UTC python3 -B scripts/ci-go-tests.py -timeout=30m ./...
          go vet ./...
      - name: Stateful transport and runtime race checks
        run: python3 -B scripts/ci-go-tests.py -race -timeout=30m ./internal/projectnetwork ./internal/runtimequalify ./internal/client ./internal/access ./internal/collection ./internal/piercopy ./internal/pierstore ./internal/projectusage ./internal/piermeta ./internal/hostinstall ./internal/hostsetup ./internal/onboarding ./internal/remotesetup ./internal/omabittheme ./backend/cmd/urbit-collector ./backend/cmd/urbit-runner
      - name: Disposable Stop timing helper safety (inert fixtures only)
        env:
          GOFLAGS: ""
          OMABIT_PROJECT_RACE_VM: ""
        run: |
          python3 -B scripts/ci-go-tests.py -race -timeout=5m -tags=omabit_disposable_qualification -run '^(TestProjectStopRaceQualification.*|TestProjectShipActionDependenciesKeepJournalBeforeSignalAndExactProcess|TestIssuesProjectRaceBackendRefusesUnselectedAction|TestIssuesProjectRaceDisposableVM)$' ./internal/runtimequalify ./internal/managed
          go vet -tags=omabit_disposable_qualification ./internal/runtimequalify ./internal/managed
          python3 -B -m unittest discover -s scripts/qualification/project-transition-cow -p test_guards.py -v
          python3 -B -m unittest discover -s scripts/qualification/recording-pressure-vm -p test_guards.py -v
          python3 -c 'import json,subprocess; p=json.loads(subprocess.check_output(["go","list","-json","./internal/runtimequalify"])); assert "project_stop_race_qualification_linux.go" not in p["GoFiles"]'
      - name: Offline application recovery fixture checks
        run: |
          python3 -B -m unittest discover -s scripts/qualification/imports -p 'test_runner_app_*.py'
          python3 -B -m unittest discover -s scripts/qualification/fake-networks -p 'test_state*.py'
      - name: Build Linux binaries
        run: |
          mkdir -p build
          CGO_ENABLED=0 go build -trimpath -o build/ ./cmd/... ./backend/cmd/...
      - name: Shared CLI and MCP contracts
        env:
          TZ: UTC
          OMABIT_TEST_OMABIT_BINARY: ${{ github.workspace }}/build/omabit
          OMABIT_TEST_COLLECTOR_BINARY: ${{ github.workspace }}/build/urbit-collector
        run: |
          python3 -B scripts/ci-go-tests.py -race -timeout=5m ./internal/service ./internal/mcpserver ./internal/guidance ./cmd/omabit
          python3 -B scripts/ci-go-tests.py -race -timeout=5m -run 'TestProjectStopRecovery(MCPSubmitCLILookupAcrossManagerRestart|ActualCollectorLostReply)$' ./internal/managed
      - name: Desktop model and installer fixtures
        run: |
          node scripts/test-panel-model.js
          node scripts/test-runtime-settings-model.js
          python3 -B scripts/test-panel-install.py
          python3 -B scripts/test-native-plugin.py
          python3 -B scripts/test-ssh-hosts.py
          python3 -B scripts/test-release-policy.py
          python3 -B scripts/test-skill-package.py
          python3 -B scripts/test-agent-help.py
          python3 -B scripts/sync-app-development-guidance.py --check
          python3 -B scripts/test-channels.py
          python3 -B scripts/test-desktop-bootstrap.py
          python3 -B scripts/test-bootstrap-observation.py
          python3 -B -m unittest discover -s scripts/qualification/desktop -p 'test_*.py'
          python3 -B scripts/test-desktop-qualification.py
          python3 -B scripts/test-import-recovery.py --static
          python3 -B -m unittest discover -s scripts/qualification/host-packages -p 'test_*.py'
      - name: Release source isolation and reproducibility
        run: python3 -B scripts/test-release-source.py --build

  managed-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Complete managed-state race coverage
        env:
          TZ: UTC
        run: python3 -B scripts/ci-go-tests.py --managed-shard ${{ matrix.shard }}/4 -race -timeout=40m -count=1

  source:
    if: always()
    needs: [core, managed-race]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every source and race gate
        env:
          CORE: ${{ needs.core.result }}
          RACE: ${{ needs.managed-race.result }}
        run: test "$CORE" = success && test "$RACE" = success

  qml-offscreen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install isolated Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qml-qt6 qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-dialogs qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtqml-models
      - name: Actual QML bindings and recovery interactions
        env:
          QT_QML_EXECUTABLE: /usr/lib/qt6/bin/qml
        run: |
          python3 -B scripts/test-observation-schedule.py
          python3 -B scripts/test-rc11-panel-offscreen.py --require-qt
          python3 -B scripts/test-host-compatibility-offscreen.py --require-qt
          python3 -B scripts/test-service-upgrade-offscreen.py --require-qt

# Mapped Quickshell tests and live runtime qualification require their separately
# controlled Omarchy/Docker environments; they are not claimed by this CI job.
